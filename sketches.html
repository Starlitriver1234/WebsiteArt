<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tudor Marinescu | Sketches</title>
    
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Starlitriver1234/WebsiteArt/main/Images/LogoTudor.png">
    <link rel="stylesheet" href="style.css"> 
    
    <style>
        html { 
            background: #000; 
            scroll-behavior: smooth;
        }

        .fade-element {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform;
        }

        .fade-element.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .gallery-header {
            text-align: left;
            padding: 140px 20px 20px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .gallery-header h1 {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            font-size: clamp(40px, 8vw, 70px);
            font-weight: 800;
            color: #75BEF0;
            margin: 0;
            letter-spacing: -2px;
            text-transform: uppercase;
        }

        .gallery-header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 18px;
            margin-top: 12px;
            line-height: 1.6;
            max-width: 900px;
        }

        .full-gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            padding: 30px 5% 50px 5%;
            max-width: 1400px;
            margin: 0 auto;
            align-items: start;
        }

        @media screen and (max-width: 600px) { 
            .full-gallery-grid { 
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
                gap: 15px;
                padding: 20px 4% 40px 4%;
            } 
            .gallery-header {
                padding-top: 110px;
            }
        }

        .art-card {
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            aspect-ratio: 1 / 1;
            position: relative;
            content-visibility: auto;
            contain-intrinsic-size: 1px 300px;
            transform: translateZ(0);
        }

        .art-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, #111 25%, #1c1c1c 50%, #111 75%);
            background-size: 200% 100%;
            animation: pulse 1.8s infinite ease-in-out;
            z-index: 0;
        }

        @keyframes pulse {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .art-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            display: block;
            position: relative;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), filter 0.4s ease;
            will-change: transform, filter, opacity; 
            pointer-events: none; 
            user-select: none;
        }

        .art-card:hover img {
            transform: scale(1.05);
            filter: brightness(1.08) contrast(1.02);
        }

        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            user-select: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            touch-action: none;
        }

        .lb-content {
            position: relative;
            width: 90vw;
            height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 4px;
        }

        .lb-content img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            cursor: zoom-in;
            transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: center center;
            will-change: transform;
            user-select: none;
            -webkit-user-drag: none;
        }

        .lb-content img.zoomed {
            transform: scale(2.5);
            cursor: zoom-out;
        }

        .control-btn {
            position: absolute;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 24px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: background 0.2s, transform 0.1s;
            z-index: 10001;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .control-btn:active {
            transform: scale(0.92);
        }

        .close-btn { top: 20px; right: 20px; font-size: 28px; }
        .prev-btn { left: 20px; top: 50%; transform: translateY(-50%); }
        .next-btn { right: 20px; top: 50%; transform: translateY(-50%); }

        .prev-btn:active { transform: translateY(-50%) scale(0.92); }
        .next-btn:active { transform: translateY(-50%) scale(0.92); }

        .navbar::before {
            z-index: -1; 
            pointer-events: none;
        }

        @media screen and (max-width: 768px) {
            .menu-toggle { 
                display: flex; 
                flex-direction: column;
                gap: 5px;
                cursor: pointer;
                z-index: 1003;
            }
            
            .bar {
                width: 25px;
                height: 3px;
                background-color: #75BEF0 !important;
                display: block;
                transform-origin: center;
                transition: all 0.3s ease-in-out;
            }

            .menu-toggle.is-active .bar:nth-child(1) {
                transform: translateY(8px) rotate(45deg);
            }
            .menu-toggle.is-active .bar:nth-child(2) {
                opacity: 0;
            }
            .menu-toggle.is-active .bar:nth-child(3) {
                transform: translateY(-8px) rotate(-45deg);
            }

            .nav-links {
                display: flex;
                flex-direction: column;
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                background: rgba(16, 45, 94, 0.98);
                padding: 90px 0 20px 0;
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
                border-bottom-left-radius: 16px; 
                border-bottom-right-radius: 16px;
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                z-index: -1;
                opacity: 0;
                visibility: hidden;
                transform: translateY(-100%); 
                transition: transform 0.5s ease-in-out, opacity 0.4s ease-in-out, visibility 0.5s;
                max-height: 85vh; 
                overflow-y: auto; 
            }
            
            .nav-links.active { 
                opacity: 1;
                visibility: visible;
                transform: translateY(0); 
            }

            .nav-btn { 
                width: 85%;
                margin: 8px auto;
                text-align: center; 
                font-size: 16px;
                padding: 14px 20px;
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(117, 190, 240, 0.2);
                border-radius: 12px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                display: block;
                opacity: 0;
                transform: translateY(-8px);
                transition: opacity 0.3s ease, transform 0.3s ease, background 0.2s, border-color 0.2s;
            }

            .nav-links.active .nav-btn {
                opacity: 1;
                transform: translateY(0);
            }

            .nav-links.active .nav-btn:nth-child(1) { transition-delay: 0.10s; }
            .nav-links.active .nav-btn:nth-child(2) { transition-delay: 0.14s; }
            .nav-links.active .nav-btn:nth-child(3) { transition-delay: 0.18s; }
            .nav-links.active .nav-btn:nth-child(4) { transition-delay: 0.22s; }
            .nav-links.active .nav-btn:nth-child(5) { transition-delay: 0.26s; }
            .nav-links.active .nav-btn:nth-child(6) { transition-delay: 0.30s; }
            .nav-links.active .nav-btn:nth-child(7) { transition-delay: 0.34s; }

            .control-btn { width: 44px; height: 44px; font-size: 20px; }
            .prev-btn { left: 10px; }
            .next-btn { right: 10px; }
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="menu-toggle" id="mobile-menu">
            <span class="bar"></span><span class="bar"></span><span class="bar"></span>
        </div>
        <div class="nav-links">
            <a href="index.html" class="nav-btn">Home</a>
            <a href="gallery.html" class="nav-btn">Gallery</a>
            <a href="games.html" class="nav-btn">Video Games</a>
            <a href="books.html" class="nav-btn">Books</a>
            <a href="music.html" class="nav-btn">Music</a>
            <a href="media.html" class="nav-btn">Creative Media</a>
            <a href="sketches.html" class="nav-btn active">Sketches</a>
        </div>

        <div class="nav-logo">
            <a href="index.html">
                <img src="https://raw.githubusercontent.com/Starlitriver1234/WebsiteArt/main/Images/LogoTudor.png" alt="Tudor Marinescu Logo">
            </a>
        </div>
    </nav>

    <header class="gallery-header">
        <h1 class="fade-element">Sketches</h1>
        <p class="fade-element">Welcome to the most secretive area of the website! The one where you will find the starting points of artworks that are here or are yet to be.</p>
        <p class="fade-element">Enjoy this little behind-the-scenes peek!</p>
    </header>

    <div class="full-gallery-grid" id="art-container"></div>

    <div id="lightbox" class="lightbox">
        <button class="control-btn close-btn" aria-label="Close lightbox">&times;</button>
        <button class="control-btn prev-btn" aria-label="Previous image">&#10094;</button>
        <div class="lb-content">
            <img id="lightbox-img" src="" alt="Full Artwork View" oncontextmenu="return false;" ondragstart="return false;">
        </div>
        <button class="control-btn next-btn" aria-label="Next image">&#10095;</button>
    </div>

    <script>
        const totalImages = 50;
        const cacheVersion = "2"; 

        const container = document.getElementById('art-container');
        const lb = document.getElementById('lightbox');
        const lbImg = document.getElementById('lightbox-img');

        let currentIdx = 1;

        const getThumbUrl = (id) => `https://images.weserv.nl/?url=raw.githubusercontent.com/Starlitriver1234/WebsiteArt/main/Sketches/${id}.jpg&w=600&q=82&v=${cacheVersion}`;
        const getRawOriginalUrl = (id) => `https://raw.githubusercontent.com/Starlitriver1234/WebsiteArt/main/Sketches/${id}.jpg`;

        const scrollObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                    observer.unobserve(entry.target);
                }
            });
        }, {
            root: null,
            threshold: 0.08,
            rootMargin: '0px 0px 50px 0px'
        });

        document.querySelectorAll('.fade-element').forEach((el, idx) => {
            el.style.transitionDelay = `${idx * 0.08}s`;
            scrollObserver.observe(el);
        });

        const fragment = document.createDocumentFragment();
        
        for (let i = 1; i <= totalImages; i++) {
            const card = document.createElement('div');
            card.className = 'art-card fade-element';
            
            const img = document.createElement('img');
            img.loading = "lazy";
            img.decoding = "async";
            img.alt = `Tudor Marinescu Sketch ${i}`;
            
            img.onload = () => { img.style.opacity = "1"; };
            img.onerror = () => { img.src = getRawOriginalUrl(i); };
            
            img.src = getThumbUrl(i); 

            card.onmouseenter = () => {
                const prefetchRaw = new Image();
                prefetchRaw.src = getRawOriginalUrl(i);
            };
            
            card.onclick = () => {
                openLightbox(i);
            };
            
            card.appendChild(img);
            fragment.appendChild(card);
            scrollObserver.observe(card);
        }
        container.appendChild(fragment);

        const preloadAdjacent = (index) => {
            const nextIdx = index + 1 > totalImages ? 1 : index + 1;
            const prevIdx = index - 1 < 1 ? totalImages : index - 1;
            
            const imgNext = new Image(); imgNext.src = getRawOriginalUrl(nextIdx);
            const imgPrev = new Image(); imgPrev.src = getRawOriginalUrl(prevIdx);
        };

        const openLightbox = (index) => {
            currentIdx = index;
            lb.style.display = "flex";
            resetZoom();
            lbImg.src = getRawOriginalUrl(currentIdx);
            document.body.style.overflow = "hidden";
            preloadAdjacent(currentIdx);
        };

        const resetZoom = () => {
            lbImg.classList.remove('zoomed');
            lbImg.style.transform = '';
            lbImg.style.transformOrigin = 'center center';
        };

        const closeLb = () => {
            lb.style.display = "none";
            resetZoom();
            lbImg.src = ""; 
            document.body.style.overflow = "";
        };

        const move = (dir) => {
            currentIdx += dir;
            if (currentIdx > totalImages) currentIdx = 1;
            if (currentIdx < 1) currentIdx = totalImages;
            resetZoom();
            lbImg.src = getRawOriginalUrl(currentIdx);
            preloadAdjacent(currentIdx);
        };

        const handlePan = (e) => {
            if (!lbImg.classList.contains('zoomed')) return;
            
            const rect = document.querySelector('.lb-content').getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            
            if (!clientX || !clientY) return;

            const x = ((clientX - rect.left) / rect.width) * 100;
            const y = ((clientY - rect.top) / rect.height) * 100;

            lbImg.style.transformOrigin = `${x}% ${y}%`;
        };

        lbImg.onclick = (e) => {
            e.stopPropagation();
            lbImg.classList.toggle('zoomed');
            if (lbImg.classList.contains('zoomed')) {
                handlePan(e);
            } else {
                lbImg.style.transformOrigin = 'center center';
            }
        };

        lbImg.onmousemove = handlePan;
        lbImg.ontouchmove = handlePan;

        document.querySelector('.close-btn').onclick = closeLb;
        document.querySelector('.next-btn').onclick = (e) => { e.stopPropagation(); move(1); };
        document.querySelector('.prev-btn').onclick = (e) => { e.stopPropagation(); move(-1); };

        lb.onclick = (e) => { 
            if (e.target === lb || e.target.className === 'lb-content') closeLb(); 
        };

        // NAVIGATION MENU
        const menu = document.getElementById('mobile-menu');
        const menuLinks = document.querySelector('.nav-links');

        if (menu && menuLinks) {
            menu.addEventListener('click', () => {
                menuLinks.classList.toggle('active');
                menu.classList.toggle('is-active');
            });

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    menuLinks.classList.remove('active');
                    menu.classList.remove('is-active');
                });
            });
        }

        // KEYBOARD & SWIPE CONTROLS
        window.onkeydown = (e) => {
            if (lb.style.display === "flex") {
                if (e.key === "ArrowRight") move(1);
                if (e.key === "ArrowLeft") move(-1);
                if (e.key === "Escape") closeLb();
            }
        };

        document.addEventListener('contextmenu', (e) => { if (e.target.tagName === 'IMG') e.preventDefault(); });
        document.addEventListener('dragstart', (e) => { if (e.target.tagName === 'IMG') e.preventDefault(); });

        if (history.scrollRestoration) history.scrollRestoration = 'manual';

        let touchStartX = 0;
        let touchEndX = 0;

        lb.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        lb.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            if (!lbImg.classList.contains('zoomed')) {
                if (touchEndX < touchStartX - 50) move(1); 
                if (touchEndX > touchStartX + 50) move(-1); 
            }
        });
    </script>
</body>
</html>
